# Render Blueprint: the NestJS backend (API + Socket.IO) on Render's free plan.
# Render → New → Blueprint → pick this repo and branch. It asks only for DATABASE_URL (copy it from backend/.env).
# The free plan sleeps after 15 minutes without visits; the first request after that takes about a minute.
services:
  - type: web
    name: pingpingme-api
    runtime: node
    plan: free
    rootDir: backend
    # dev dependencies are needed for `nest build`
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # secret: paste it in the Render dashboard
      # tables are created/updated on start (the project has no migrations)
      - key: DB_SYNC
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: ALLOW_RESET
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # the phone app calls from anywhere
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "10"
